name: flo_finance
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  path_provider: ^2.1.5
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  uuid: ^4.5.3
  fl_chart: ^1.2.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  image_picker: ^1.2.1
  share_plus: ^12.0.2
  shimmer: ^3.0.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.10
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E1B4B"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
